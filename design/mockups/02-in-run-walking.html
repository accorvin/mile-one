<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mile One — Walking Interval (Revised)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; }
.phone { width: 393px; height: 852px; background: #0a0a1a; border-radius: 47px; border: 3px solid #333; position: relative; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.5); }
.notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #0a0a1a; border-radius: 0 0 20px 20px; z-index: 10; }
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 30px 0; height: 54px; color: #fff; font-size: 14px; font-weight: 600; }
.screen { padding: 0 24px; height: calc(100% - 54px); display: flex; flex-direction: column; }
.progress-section { margin-top: 12px; }
.progress-label { color: rgba(255,255,255,.55); font-size: 13px; font-weight: 500; letter-spacing: .5px; margin-bottom: 8px; text-align: center; }
.progress-bar-bg { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; width: 75%; background: linear-gradient(90deg, #4ade80, #22c55e); border-radius: 3px; }
.progress-detail { display: flex; justify-content: space-between; margin-top: 6px; color: rgba(255,255,255,.5); font-size: 12px; font-weight: 500; }
.interval-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: -10px; }
.interval-badge { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 22px; margin-bottom: 16px; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.badge-walk { background: rgba(96,165,250,.15); color: #60a5fa; border: 1.5px solid rgba(96,165,250,.3); }
.walk-icon { width: 18px; height: 18px; fill: #60a5fa; }
.countdown { font-size: 96px; font-weight: 300; color: #fff; letter-spacing: -2px; line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(255,255,255,.1); }
.countdown-label { color: rgba(255,255,255,.55); font-size: 14px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 28px; }
.next-interval { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.2); border-radius: 12px; }
.next-text { color: #4ade80; font-size: 14px; font-weight: 500; }
.encouragement { color: rgba(255,255,255,.55); font-size: 14px; margin-top: 16px; font-weight: 500; }
.stats-section { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: rgba(255,255,255,.06); border-radius: 16px; overflow: hidden; margin-top: auto; margin-bottom: 16px; }
.stat { background: #0a0a1a; padding: 16px 12px; text-align: center; }
.stat-value { color: #fff; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.stat-label { color: rgba(255,255,255,.5); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.map-hint { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; color: rgba(255,255,255,.35); font-size: 12px; font-weight: 500; }
.map-hint svg { width: 14px; height: 14px; fill: rgba(255,255,255,.35); }
.controls { display: flex; gap: 64px; justify-content: center; padding-bottom: 40px; }
.btn { border: none; border-radius: 50%; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.btn-pause { background: rgba(255,255,255,.12); }
.btn-pause svg { width: 24px; height: 24px; fill: #fff; }
.btn-end { background: rgba(239,68,68,.1); border: 1.5px solid rgba(239,68,68,.2); }
.btn-end svg { width: 18px; height: 18px; fill: rgba(239,68,68,.6); }
.btn-label { color: rgba(255,255,255,.45); font-size: 10px; text-align: center; margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
.control-group { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <div style="width:54px; color:#fff">3:52</div>
    <div style="width:54px"></div>
    <div style="display:flex;gap:5px;align-items:center;width:77px;justify-content:flex-end">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><rect x="0" y="5" width="3" height="7" rx="1"/><rect x="4.5" y="3" width="3" height="9" rx="1"/><rect x="9" y="1" width="3" height="11" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity=".3"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="0" width="17" height="12" rx="3" fill="none" stroke="white" stroke-width="1.2"/><rect x="1.5" y="1.5" width="10" height="9" rx="1.5" fill="white"/><rect x="17" y="3.5" width="2" height="5" rx="1" fill="white"/></svg>
    </div>
  </div>
  <div class="screen">
    <div class="progress-section">
      <div class="progress-label">Week 3 · Run 2 of 3</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
      <div class="progress-detail">
        <span>Interval 6 of 8</span>
        <span>75%</span>
      </div>
    </div>

    <div class="interval-section">
      <div class="interval-badge badge-walk">
        <!-- Walker icon for colorblind accessibility -->
        <svg class="walk-icon" viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L7 8.3V13h2V9.6l.8-.7z"/></svg>
        Walking
      </div>
      <div class="countdown">0:47</div>
      <div class="countdown-label">remaining this interval</div>
      <div class="next-interval">
        <span class="next-text">🏃 Run 3:00 up next</span>
      </div>
      <div class="encouragement">One more run interval — you've got this 💪</div>
    </div>

    <div class="map-hint">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      Swipe for map →
    </div>

    <div class="stats-section">
      <div class="stat">
        <div class="stat-value">17:08</div>
        <div class="stat-label">Time</div>
      </div>
      <div class="stat">
        <div class="stat-value">1.14</div>
        <div class="stat-label">Miles</div>
      </div>
      <div class="stat">
        <div class="stat-value">15:02</div>
        <div class="stat-label">Pace</div>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <div class="btn btn-pause">
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="btn-label">Pause</div>
      </div>
      <div class="control-group">
        <div class="btn btn-end">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </div>
        <div class="btn-label">End Run</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
